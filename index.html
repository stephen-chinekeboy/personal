<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-list</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
    <p>Todo List</p>
    <div class="todo-grid-container">
      <input class="js-todo-name todo-name" placeholder="Todo-Name">
      <input type="date" class="js-todo-date todo-date">
      <input type="time" class="js-todo-time todo-time">

      <button onclick="
      addTodo()
      " class="todo-add">Add</button>
    </div>
    
    
    
  
    <div class="js-todo-html todo-grid"></div>

    <script src="/script.js"></script>
</body>
</html>
