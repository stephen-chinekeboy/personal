  <title>Netflix Homepage</title>
  <link rel="stylesheet" href="/style.css">

<body>
  <header>
    <nav>
      <h1>NETFLIX</h1>
      <ul>
        <li><a href="/sign-in.html">Sign-in</a></li>

  <section class="unlimited">

      <h2>Unlimited movies,</h2>
